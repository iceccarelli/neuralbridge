site_name: Industrial Autonomous Assurance
site_url: https://iceccarelli.github.io/neuralbridge/
site_description: Evidence infrastructure for machines whose software can hurt someone — CRA Article 14 and Machinery Regulation Annex III 1.1.9.
site_author: Industrial Autonomous Assurance
repo_name: iceccarelli/neuralbridge
repo_url: https://github.com/iceccarelli/neuralbridge
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Industrial Autonomous Assurance
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light )"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
plugins:
  - search
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Assurance engines:
    - Overview: assurance/index.md
    - Collect: assurance/collect.md
    - Machine safety: assurance/machine.md
    - Machinery Annex III: assurance/machinery.md
    - Fleet advisory: assurance/fleet.md
    - Watch: assurance/watch.md
    - Attest: assurance/attest.md
    - Offline kit: assurance/kit.md
    - Supplier feeds: assurance/supplier.md
    - Bridge: assurance/bridge.md
    - Deploying the register: assurance/deploy.md
  - Pricing: pricing.md
  - Platform status: platform.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
