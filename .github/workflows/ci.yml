name: CI — NeuralBridge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint & Type Check ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e .
      # Same scope as CLAUDE.md's definition of done: src/ AND tests/.
      - name: Run ruff linter
        run: ruff check src/ tests/
      # src/neuralbridge/ is clean under strict mode. src/assurance/ is strict too, except the
      # modules named one by one in the [[tool.mypy.overrides]] table in pyproject.toml (no
      # wildcard; tests/test_mypy_ignore_table.py keeps that table honest). A new module there is
      # checked strictly from its first commit.
      - name: Run mypy type checker
        run: mypy src/neuralbridge/ src/assurance/ --ignore-missing-imports

  # ── Marketing / workspace site (Next.js, repo root) ────────
  # Until this job existed nothing in CI installed, type-checked or built the root Next.js site
  # (the only other Node build, a separate Vite admin app, has been retired into this site), so a framework upgrade could break every
  # route and still merge green. Route-level behaviour is covered by tests-e2e/, run by the e2e job below (scripts/e2e-local.sh).
  site:
    name: Site (typecheck + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Initial JS/CSS per route against scripts/perf_budget.json (transfer size only; not Core Web Vitals).
      - run: node scripts/perf_budget.mjs
      # The repo-link gate builds the site twice (flag off, flag on); the Python test job has no
      # node_modules, so it skips there and this step is where it runs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # --noconftest: tests/conftest.py imports FastAPI, which this job does not install; this test
      # needs only pytest, node and the repo (checked in a clean environment: 159 passed, 0 skipped; the Python Tests job has no
      # node_modules, so these built-page tests skip there and run here).
      # NEURALBRIDGE_REQUIRE_NODE=1: in this job, which has node_modules, a skip for want of node or
      # node_modules is a FAILURE, not a gate that silently did not run (the same three modules skip
      # 126 tests in the Python test job, which has no node_modules). --noconftest drops
      # tests/conftest.py, so the hook is loaded by name (tests/require_postgres_plugin.py).
      - run: python -m pytest tests/test_site_repo_links.py tests/test_site_product_pages.py tests/test_site_seo.py -q -o addopts="" -p no:cacheprovider -rs --noconftest -p tests.require_postgres_plugin
        env:
          NEURALBRIDGE_REQUIRE_NODE: "1"

  # ── Browser tests (Playwright) ─────────────────────────────
  # Runs the tests-e2e/ spec set (the list in scripts/e2e-local.sh) in Chromium, desktop and mobile
  # projects, against ISOLATED real services started on the runner: the Assurance API (uvicorn,
  # SQLite ledgers and accounts in a fresh temp directory, random throwaway keys), the NeuralBridge
  # platform API (neuralbridge.main:app, the /ai control plane) on the PostgreSQL service below, with
  # real Register / Cell / Validator accounts in the same account store and a throwaway customer
  # database role, and the production `next build` + `next start` site. Nothing is mocked, no secret
  # and no Stripe key is set, and nothing but the package registries and the Playwright browser
  # download is contacted. Any failed spec fails the job, and so does any uncaught page error,
  # console error, failed first-party request or unforgiven 4xx/5xx first-party response
  # (tests-e2e/support/fixtures.ts). A missing PostgreSQL FAILS the script (exit 5); it never skips.
  # Not in this set, on purpose: phase4-visual-qa (rewrites committed screenshots; E2E_VISUAL_QA=1).
  # Not yet exercised on a GitHub-hosted runner.
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Its own database (not the `test` job's): the e2e specs create and drop a table and a role in it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuralbridge
          POSTGRES_PASSWORD: neuralbridge_dev
          POSTGRES_DB: neuralbridge_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      # A throwaway service container on the job's own network; the owner may create roles (the seed
      # makes a random-password customer role). Not a secret.
      NEURALBRIDGE_AI_PG_HOST: 127.0.0.1
      NEURALBRIDGE_AI_PG_PORT: 5432
      NEURALBRIDGE_AI_PG_USER: neuralbridge
      NEURALBRIDGE_AI_PG_PASSWORD: neuralbridge_dev
      NEURALBRIDGE_AI_PG_TEST_DATABASE: neuralbridge_ai_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # Same hash-checked install as the Python 3.11 leg of the test job (uvicorn, fastapi and the
      # `assurance` CLI that some specs shell out to).
      - name: Install Python dependencies (hash-checked lock)
        run: |
          pip install --require-hashes --no-deps -r requirements/test.lock
          pip install --no-deps -e .
          pip check
      - run: npm ci
      # The only place the browser is downloaded; locally the pre-installed Chromium is used.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        env:
          E2E_ROOT: ${{ runner.temp }}/e2e-data
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e-failure
          PYTHON: python
        run: bash scripts/e2e-local.sh
      # Failure only: nothing is uploaded from a green run. The data dir holds throwaway databases
      # and keys of this run, so only the server logs are taken from it.
      - name: Upload the Playwright report, traces and server logs (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: |
            ${{ runner.temp }}/e2e-failure/
            ${{ runner.temp }}/e2e-data/*/build.log
            ${{ runner.temp }}/e2e-data/*/web.log
            ${{ runner.temp }}/e2e-data/*/*/api.log
            ${{ runner.temp }}/e2e-data/*/*/platform.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Unit Tests ─────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One red leg must not cancel the others: the evidence from 3.11, 3.12 and 3.13 is wanted
      # whichever of them fails (a 3.13-only failure is a different finding from a failure on all three).
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # The src/neuralbridge/ai/* golden-task tests (tests/test_ai.py) run
    # against a real PostgreSQL, not a mock — see that file's own docstring
    # for why. This service container is what makes them run for real in CI
    # instead of skipping; a run with no reachable Postgres skips honestly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuralbridge
          POSTGRES_PASSWORD: neuralbridge_dev
          POSTGRES_DB: neuralbridge_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEURALBRIDGE_AI_PG_HOST: 127.0.0.1
      NEURALBRIDGE_AI_PG_PORT: 5432
      NEURALBRIDGE_AI_PG_USER: neuralbridge
      NEURALBRIDGE_AI_PG_PASSWORD: neuralbridge_dev
      NEURALBRIDGE_AI_PG_TEST_DATABASE: neuralbridge_ai_test
      # With the service above, a test skipped for want of PostgreSQL is a FAILURE, not a
      # silent skip (tests/require_postgres_plugin.py, loaded by tests/conftest.py).
      # Limitation: the Postgres tests drop and create ai_test_customers in one shared
      # database, so two jobs or processes running them against the same server at once can
      # corrupt each other; each matrix job here has its own service container.
      NEURALBRIDGE_REQUIRE_POSTGRES: "1"
      # Likewise for the offline kit's network-namespace test: a runner that cannot create
      # a namespace with no interface (.github/scripts/netns-run.sh) fails the job rather
      # than skipping the one test that enforces "the kit opens no sockets".
      NEURALBRIDGE_REQUIRE_NETNS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Python 3.11 installs from the hash-checked lock (requirements/test.lock, scripts/lock.sh):
      # pip refuses any file whose SHA-256 is not listed and resolves nothing, so this leg tests
      # exactly the pinned versions. `--no-deps -e .` adds only this package; the lock already
      # holds every dependency (tests/test_requirements_lock.py). The 3.12 and 3.13 legs
      # deliberately keep installing the latest allowed versions from requirements/test.txt, so
      # forward drift still shows up here before the lock is regenerated.
      - name: Install dependencies (hash-checked lock)
        if: matrix.python-version == '3.11'
        run: |
          pip install --require-hashes --no-deps -r requirements/test.lock
          pip install --no-deps -e .
          pip check
      - name: Install dependencies (latest allowed versions)
        if: matrix.python-version != '3.11'
        run: |
          pip install -r requirements/test.txt
          pip install -e .
      # `python -m pytest`, not the bare entry point, which may bind a different interpreter.
      # -rs lists every skip with its reason in the log; --junitxml feeds the skip gate below.
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v -rs --junitxml=junit.xml --cov=neuralbridge --cov-report=xml --cov-report=term-missing
      # Why this job reports skips at all: three modules (tests/test_site_repo_links.py,
      # test_site_product_pages.py, test_site_seo.py) build the Next.js site and skip, with a stated
      # reason, when there is no node_modules (126 tests at the time of writing). This job has no
      # Node on purpose: each of its three legs would otherwise run `npm ci` plus three production
      # builds for no new information. Those tests are NOT unrun: the `Site` job installs node_modules
      # and runs the same three modules with NEURALBRIDGE_REQUIRE_NODE=1, where a skip is a failure.
      # Postgres and network-namespace skips are already failures here (REQUIRE_* above). This step
      # closes the remaining gap: any OTHER skip reason fails the job, so a new gate that silently
      # does not run cannot hide in the "N skipped" tail. `if: always()` so it also reports when the
      # tests failed, as long as the report exists.
      - name: Skips are only the Node-dependent ones (run in the Site job)
        if: always() && hashFiles('junit.xml') != ''
        run: python scripts/check_test_skips.py junit.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: coverage.xml

  # ── Security Scan ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install scanners
        run: pip install "bandit==1.9.4" "pip-audit==2.10.1"
      # Both packages, medium severity and up. scripts/bandit-baseline.json lists the two
      # B608 findings that existed when src/assurance/ was first scanned, reviewed as false
      # positives (src/assurance/evidence/ledger.py and src/assurance/intel/store.py build SQL
      # from constant fragments and bind every value with `?`). Bandit reports only findings
      # NOT in the baseline, so any new medium/high finding fails the job. Preferred follow-up:
      # `# nosec B608` with a reason on those two lines, then delete the baseline.
      - name: Run Bandit security linter (src/neuralbridge and src/assurance)
        run: bandit -r src/neuralbridge/ src/assurance/ -ll -b scripts/bandit-baseline.json
      # Audits the exact pinned versions that ship, not the loose lower bounds. pip-audit exits
      # non-zero on any known vulnerability, and so does this step: there is no `|| true`. If a
      # finding cannot be fixed by regenerating the lock, allow-list that ONE advisory with
      # `--ignore-vuln <ID>` on the line below and a comment giving the reason and a review date.
      # Never ignore a whole package or severity.
      - name: Audit the pinned dependencies (fails on any finding)
        run: |
          for lock in assurance-service prod test; do
            echo "== requirements/${lock}.lock"
            pip-audit -r "requirements/${lock}.lock" --require-hashes --disable-pip
          done

  # ── SBOM Generation ────────────────────────────────────────
  # Built from the hash-pinned lock files, so it lists the exact versions (and SHA-256s) that the
  # two images install, not the `>=` lower bounds. It does not describe base-image OS packages or
  # the Python interpreter, and it is not tied to an image digest (deploy/assurance/RELEASE.md §4).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write       # lets the attestation step below obtain a Sigstore identity
      attestations: write   # lets it store the attestation on this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install CycloneDX
        run: pip install "cyclonedx-bom==8.0.1"
      - name: Generate SBOMs from the lock files
        run: |
          cyclonedx-py requirements requirements/prod.lock -o sbom-platform.json --of JSON
          cyclonedx-py requirements requirements/assurance-service.lock -o sbom-assurance-service.json --of JSON
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom-platform.json
            sbom-assurance-service.json
      # Signed build-provenance attestation for the two SBOM files (GitHub's built-in
      # attestations, keyless via the workflow's OIDC identity; no secret or key is used or
      # stored). It states that THIS workflow run on THIS commit produced those files. It is NOT
      # an image signature and says nothing about a container image: images are signed and
      # attested in a release workflow that does not exist yet (deploy/assurance/RELEASE.md §5).
      # Runs only for a push to main, never for a pull request. Not yet exercised on GitHub.
      - name: Attest SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom-platform.json
            sbom-assurance-service.json

  # ── Lock drift (GATING) ────────────────────────────────────
  # Checks that requirements/*.lock still equal what uv resolves from requirements/*.txt,
  # keeping the already-pinned versions (scripts/lock.sh --check; uv is pinned below). A red
  # job means a .txt input was edited without regenerating, or a locked release changed on the
  # index: run scripts/lock.sh and commit. It was advisory (continue-on-error) until
  # `scripts/lock.sh --check` was run against the committed locks with uv 0.11.32 and was
  # clean for all three; the locks are what the root image, the assurance image and the
  # Python 3.11 test leg now install, so a silent mismatch is a real defect.
  lock-drift:
    name: Lock drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==0.11.32"
      - name: Check requirements/*.lock against requirements/*.txt
        run: scripts/lock.sh --check

  # ── Workflow lint ──────────────────────────────────────────
  # The release workflow (publish-docker.yml) cannot be exercised without publishing, so the
  # strongest check available before it first runs is static: actionlint (with shellcheck on
  # every `run:` block) over all workflows, and shellcheck on the script an outsider uses to
  # verify a release. Versions are the ones the files were validated with.
  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install "actionlint-py==1.7.12.25" "shellcheck-py==0.11.0.1"
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck scripts/verify-release.sh scripts/rehearse-local.sh scripts/build-dist.sh scripts/local-stack.sh scripts/verify-buyer-path.sh

  # ── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build -t neuralbridge:test .
      - name: Test Docker image
        run: docker run --rm neuralbridge:test python -c "import neuralbridge; print(neuralbridge.__version__)"

  # ── Assurance service image: build and smoke test ──────────
  # deploy/assurance/Dockerfile is the image that gets deployed, and nothing built it before this
  # job. It builds from the repository root (the Dockerfile COPYs requirements/ and src/), starts
  # the container with NO API keys, Stripe keys or attestation key, and checks:
  #   - the process runs as a non-root user (uid 10001), as the Dockerfile says;
  #   - /livez answers 200;
  #   - /healthz answers 200 and says `degraded` / `unconfigured` / `not_configured`, i.e. it does
  #     not claim a readiness it does not have (scripts/smoke_assurance_service.py);
  #   - the pinned fastapi, uvicorn and cryptography imported from the hash-installed lock.
  # It does not push the image anywhere, use any secret, or touch a network beyond the build's
  # PyPI downloads and the container's loopback port.
  assurance-image:
    name: Assurance image (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build deploy/assurance/Dockerfile
        run: docker build -f deploy/assurance/Dockerfile -t assurance:ci .
      - name: Image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' assurance:ci)"
          echo "image USER: ${user}"
          test "${user}" = "assurance" || { echo "::error::image USER is '${user}', expected 'assurance'"; exit 1; }
      - name: Start the container (no keys, no Stripe, no attestation key)
        run: |
          # The service runs as uid 10001 and must be able to write its volume.
          mkdir -p "${RUNNER_TEMP}/assurance-data"
          sudo chown 10001:10001 "${RUNNER_TEMP}/assurance-data"
          docker run -d --name assurance-smoke \
            -p 127.0.0.1:8080:8080 \
            -v "${RUNNER_TEMP}/assurance-data:/data" \
            assurance:ci
      - name: The process inside is not root, and the pinned packages are the ones imported
        run: |
          uid="$(docker exec assurance-smoke id -u)"
          echo "container uid: ${uid}"
          test "${uid}" != "0" || { echo "::error::container runs as root"; exit 1; }
          docker exec assurance-smoke python -c "import fastapi, uvicorn, cryptography, httpx, pydantic; print('fastapi', fastapi.__version__, '| cryptography', cryptography.__version__)"
          docker exec assurance-smoke pip --version
          # the locked version of fastapi is the installed one
          locked="$(grep -m1 -E '^fastapi==' requirements/assurance-service.lock | cut -d= -f3 | cut -d' ' -f1)"
          installed="$(docker exec assurance-smoke python -c 'import fastapi; print(fastapi.__version__)')"
          echo "fastapi locked=${locked} installed=${installed}"
          test "${locked}" = "${installed}" || { echo "::error::installed fastapi is not the locked one"; exit 1; }
      - name: /livez answers and /healthz reports the unconfigured state honestly
        run: python scripts/smoke_assurance_service.py http://127.0.0.1:8080
      - name: Container logs
        if: always()
        run: docker logs assurance-smoke || true
      - name: Remove the container
        if: always()
        run: docker rm -f assurance-smoke || true

  # ── Docs Build & Deploy ────────────────────────────────────
  # Deploys via the native GitHub Pages Actions flow (configure-pages +
  # upload-pages-artifact + deploy-pages) instead of `mkdocs gh-deploy`.
  # gh-deploy only pushes a built site to the gh-pages branch — it does
  # not itself turn Pages on, so a repo where Pages was never enabled in
  # Settings stays a 404 forever even with a perfectly good gh-pages
  # branch.
  #
  # `configure-pages` with `enablement: true` calls the Pages API to try
  # to create the site — but confirmed live that the default GITHUB_TOKEN
  # cannot do this at all, regardless of the `pages: write` permission
  # declared below: "Create Pages site failed. Error: Resource not
  # accessible by integration". This is a hard GitHub restriction, not a
  # workflow config problem — creating a Pages site for the first time
  # needs repo admin rights that no Actions token carries. There is a
  # one-time, unavoidable manual step: a repo admin visits Settings ->
  # Pages -> Build and deployment -> Source, and picks "GitHub Actions".
  # Once that is set, this job starts publishing automatically and no
  # further manual steps are needed on future pushes.
  #
  # Until that happens, `continue-on-error` on configure-pages keeps this
  # from being a permanent red X on every push to main, and the later
  # steps are skipped rather than failing against a site that doesn't
  # exist yet. See SMOKE.md / DEPLOY_NOW.md for the founder checklist.
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install "mkdocs-material<10" "mkdocs<2"
      - name: Build docs
        run: mkdocs build --strict
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Pages not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repo and the" \
               "default GITHUB_TOKEN cannot enable it (GitHub restriction, not" \
               "a config bug). A repo admin must visit Settings > Pages >" \
               "Build and deployment > Source and choose 'GitHub Actions' once." \
               "This job will publish automatically on the next push after that."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1