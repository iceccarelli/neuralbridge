name: CI — NeuralBridge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ── Lint & Type Check ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e .
      # Same scope as CLAUDE.md's definition of done: src/ AND tests/.
      - name: Run ruff linter
        run: ruff check src/ tests/
      - name: Run mypy type checker
        run: mypy src/neuralbridge/ --ignore-missing-imports

  # ── Marketing / workspace site (Next.js, repo root) ────────
  # Until this job existed nothing in CI installed, type-checked or built the root Next.js site
  # (the `dashboard` job below builds src/dashboard only), so a framework upgrade could break every
  # route and still merge green. Route-level behaviour is covered by tests-e2e/ (scripts/e2e-assurance.sh).
  site:
    name: Site (typecheck + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The repo-link gate builds the site twice (flag off, flag on); the Python test job has no
      # node_modules, so it skips there and this step is where it runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_site_repo_links.py -q -o addopts="" -p no:cacheprovider -rs

  # ── Unit Tests ─────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # The src/neuralbridge/ai/* golden-task tests (tests/test_ai.py) run
    # against a real PostgreSQL, not a mock — see that file's own docstring
    # for why. This service container is what makes them run for real in CI
    # instead of skipping; a run with no reachable Postgres skips honestly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuralbridge
          POSTGRES_PASSWORD: neuralbridge_dev
          POSTGRES_DB: neuralbridge_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEURALBRIDGE_AI_PG_HOST: 127.0.0.1
      NEURALBRIDGE_AI_PG_PORT: 5432
      NEURALBRIDGE_AI_PG_USER: neuralbridge
      NEURALBRIDGE_AI_PG_PASSWORD: neuralbridge_dev
      NEURALBRIDGE_AI_PG_TEST_DATABASE: neuralbridge_ai_test
      # With the service above, a test skipped for want of PostgreSQL is a FAILURE, not a
      # silent skip (tests/require_postgres_plugin.py, loaded by tests/conftest.py).
      # Limitation: the Postgres tests drop and create ai_test_customers in one shared
      # database, so two jobs or processes running them against the same server at once can
      # corrupt each other; each matrix job here has its own service container.
      NEURALBRIDGE_REQUIRE_POSTGRES: "1"
      # Likewise for the offline kit's network-namespace test: a runner that cannot create
      # a namespace with no interface (.github/scripts/netns-run.sh) fails the job rather
      # than skipping the one test that enforces "the kit opens no sockets".
      NEURALBRIDGE_REQUIRE_NETNS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements/test.txt
          pip install -e .
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=neuralbridge --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ── Security Scan ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install bandit safety
      - name: Run Bandit security linter
        run: bandit -r src/neuralbridge/ -ll
      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements/base.txt || true

  # ── SBOM Generation ────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CycloneDX
        run: pip install cyclonedx-bom
      - name: Generate SBOM
        run: cyclonedx-py requirements requirements/base.txt -o sbom.json --of JSON
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ── Dashboard Build ────────────────────────────────────────
  dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: src/dashboard
        run: npm install
      - name: Build dashboard
        working-directory: src/dashboard
        run: npm run build

  # ── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t neuralbridge:test .
      - name: Test Docker image
        run: docker run --rm neuralbridge:test python -c "import neuralbridge; print(neuralbridge.__version__)"

  # ── Docs Build & Deploy ────────────────────────────────────
  # Deploys via the native GitHub Pages Actions flow (configure-pages +
  # upload-pages-artifact + deploy-pages) instead of `mkdocs gh-deploy`.
  # gh-deploy only pushes a built site to the gh-pages branch — it does
  # not itself turn Pages on, so a repo where Pages was never enabled in
  # Settings stays a 404 forever even with a perfectly good gh-pages
  # branch.
  #
  # `configure-pages` with `enablement: true` calls the Pages API to try
  # to create the site — but confirmed live that the default GITHUB_TOKEN
  # cannot do this at all, regardless of the `pages: write` permission
  # declared below: "Create Pages site failed. Error: Resource not
  # accessible by integration". This is a hard GitHub restriction, not a
  # workflow config problem — creating a Pages site for the first time
  # needs repo admin rights that no Actions token carries. There is a
  # one-time, unavoidable manual step: a repo admin visits Settings ->
  # Pages -> Build and deployment -> Source, and picks "GitHub Actions".
  # Once that is set, this job starts publishing automatically and no
  # further manual steps are needed on future pushes.
  #
  # Until that happens, `continue-on-error` on configure-pages keeps this
  # from being a permanent red X on every push to main, and the later
  # steps are skipped rather than failing against a site that doesn't
  # exist yet. See SMOKE.md / DEPLOY_NOW.md for the founder checklist.
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install "mkdocs-material<10" "mkdocs<2"
      - name: Build docs
        run: mkdocs build --strict
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repo and the" \
               "default GITHUB_TOKEN cannot enable it (GitHub restriction, not" \
               "a config bug). A repo admin must visit Settings > Pages >" \
               "Build and deployment > Source and choose 'GitHub Actions' once." \
               "This job will publish automatically on the next push after that."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
