name: Stress test (independent authority)

# github-actions[bot] runs the independent adversarial suite (iceccarelli/neuralbridge-stress-test,
# the test authority) against this repository's main every night, so a regression in an
# entitlement, a disclosure or a claim is seen within a day instead of at the next release.
# Read-only: no secrets, no deploy, no write permission, nothing is posted anywhere. A red run
# is the signal; the job summary lists the failing tests.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      stress_ref:
        description: "Branch, tag or SHA of the stress-test repository (default: its default branch)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stress-test
  cancel-in-progress: true

jobs:
  stress:
    name: Stress suite against this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neuralbridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iceccarelli/neuralbridge-stress-test
          ref: ${{ inputs.stress_ref }}
          path: neuralbridge-stress-test
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the product and the suite's dependencies
        working-directory: neuralbridge
        run: |
          pip install -r requirements/test.txt
          pip install -e .
          pip install "pytest>=8.3,<9" "cryptography>=42"
      - name: Run the suite
        working-directory: neuralbridge-stress-test
        env:
          NEURALBRIDGE_SRC: ${{ github.workspace }}/neuralbridge/src
        run: |
          set -o pipefail
          python -m pytest -q -rfEX --no-header 2>&1 | tee "$RUNNER_TEMP/stress.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Stress suite against \`${GITHUB_SHA::12}\`"
            echo '```'
            grep -E "^(FAILED|ERROR|XPASS)|passed|failed|skipped" "$RUNNER_TEMP/stress.txt" | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
