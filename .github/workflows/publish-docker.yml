name: Publish signed container images to GHCR

# THE ONLY workflow that pushes a container image. It is written and statically validated
# (actionlint); it has NOT run on GitHub. See deploy/assurance/RELEASE.md section 5 and
# scripts/verify-release.sh.
#
# When it runs: a pushed version tag (v*) or a manual dispatch. Never on a branch push, a pull
# request, a merge or a GitHub "release published" event (a release created from a tag would fire
# the tag push AND the release event, building twice). The old release.yml, which pushed the root
# image unsigned and moved a `latest` tag on every tag, was removed so there is one publish path.
#
# What a run produces, per image (the platform image from ./Dockerfile and the assurance service
# image from deploy/assurance/Dockerfile), all keyed on the pushed image DIGEST, never a tag:
#   1. the image pushed to ghcr.io/<owner>/<repo> and ghcr.io/<owner>/<repo>-assurance;
#   2. a keyless cosign signature of the digest (Sigstore, identity = this workflow at this ref);
#   3. a GitHub build-provenance attestation (SLSA provenance v1) with subject = the digest,
#      pushed to the registry beside the image;
#   4. an SBOM attestation (CycloneDX, built from the hash-pinned lock the image installs; it does
#      not list base-image OS packages) with subject = the digest;
#   5. a self-check: scripts/verify-release.sh must verify 2-4 for the digest just pushed, or the
#      job fails.
# No secret, key or token other than the run's own GITHUB_TOKEN and OIDC identity is used.
# No `latest` tag is moved: redeploy by digest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Nothing is writable by default; each job below asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish a commit that is not on main: a tag on an unreviewed branch must not
  # become a signed artefact that looks official.
  guard:
    name: Commit is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require the built commit to be an ancestor of origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not on main; refusing to publish or sign it."
            exit 1
          fi

  publish:
    name: Build, sign and attest (${{ matrix.name }})
    needs: guard
    runs-on: ubuntu-latest
    # A named environment lets the repository owner add required reviewers in
    # Settings > Environments > release, so a publish waits for a person. Without that setting
    # it does not wait; this file cannot set it.
    environment: release
    permissions:
      contents: read        # checkout
      packages: write       # push to GHCR with GITHUB_TOKEN
      id-token: write       # keyless Sigstore identity for cosign and for the attestations
      attestations: write   # store the GitHub attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            dockerfile: Dockerfile
            suffix: ""
            lock: requirements/prod.lock
          - name: assurance
            dockerfile: deploy/assurance/Dockerfile
            suffix: "-assurance"
            lock: requirements/assurance-service.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # GHCR names must be lower case; github.repository may not be.
      - name: Compute the lower-case image name
        id: names
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}${SUFFIX}" >> "${GITHUB_OUTPUT}"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tags exist only for a version tag. A manual dispatch from a branch gets the
      # sha tag only, so it can never take a version number. No `latest`.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long

      # provenance/sbom are off here on purpose: BuildKit's own attestations would add a second,
      # differently-scoped set of statements to the index. The attestations that matter are the
      # GitHub provenance and SBOM below, bound to the digest. No build cache: a release is built
      # from scratch. Single platform: linux/arm64 was never validated (no QEMU step existed).
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true

      - name: Resolve and check the pushed digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build produced no valid image digest (got '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${{ steps.names.outputs.image }}@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: "v2.4.1"

      # Keyless: the signature certificate names this workflow and ref; the signature and
      # certificate are recorded in the public Rekor transparency log.
      - name: Sign the image digest (keyless)
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance for the image digest
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # The SBOM comes from the lock file the Dockerfile installs with --require-hashes. It lists
      # exact Python packages and their SHA-256s; it does not describe OS packages, the
      # interpreter or the dashboard's npm tree. It is not an image scan.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate the CycloneDX SBOM from the lock
        env:
          LOCK: ${{ matrix.lock }}
          NAME: ${{ matrix.name }}
        run: |
          pip install "cyclonedx-bom==8.0.1"
          cyclonedx-py requirements "${LOCK}" --of JSON -o "sbom-${NAME}.cdx.json"

      - name: Attest the SBOM for the image digest
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.cdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

      # The workflow checks its own output the way an outsider would. If this fails, the image
      # is already pushed but must not be treated as released: do not announce its digest.
      - name: Self-check with scripts/verify-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPO: ${{ steps.names.outputs.repo }}
        run: |
          scripts/verify-release.sh --image "${IMAGE}" --digest "${DIGEST}" --repo "${REPO}" \
            --ref "${GITHUB_REF}"

      - name: Record the digest in the run summary
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo ""
            echo '`'"${IMAGE}@${DIGEST}"'`'
            echo ""
            echo "Verify: \`scripts/verify-release.sh --image ${IMAGE} --digest ${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
