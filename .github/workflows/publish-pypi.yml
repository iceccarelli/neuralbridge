name: Publish to PyPI

# Trusted publishing (OIDC) with build provenance. There is NO long-lived PyPI token anywhere: the
# publish job exchanges this run's GitHub OIDC identity for a short-lived PyPI upload token, and only
# if the project on PyPI has this exact repository + workflow file + environment registered as a
# trusted publisher. This workflow is written and statically validated (actionlint + shellcheck, CI
# job `workflow-lint`); it has NOT run on GitHub and nothing has ever been published to PyPI from it.
# See deploy/assurance/RELEASE.md section 5b for the founder steps, including the PyPI-side setup
# and the licence decision (pyproject.toml declares "Proprietary - All rights reserved").
#
# When it runs
#   - release published   -> build, attest, then publish (the publish job waits for approval)
#   - workflow_dispatch   -> build and check ONLY (a dry run: nothing is attested, nothing is
#                            uploaded), unless the `publish` input is ticked AND the run is on a
#                            version tag, in which case it behaves like a release.
#   Never on a push, a pull request or a merge.
#
# Jobs (build and publish are separate on purpose: the publish job holds the only upload-capable
# identity, runs no repository code beyond the pinned publish action, and checks out nothing)
#   guard    the commit is an ancestor of origin/main, and the tag equals the pyproject.toml version
#   build    scripts/build-dist.sh (python -m build, twine check --strict, name/version checks),
#            then a GitHub build-provenance attestation (SLSA v1) over the exact files, then the
#            files are uploaded as a workflow artifact; no PyPI identity here
#   publish  environment `pypi` -> approval gate -> download the same files -> pypa/gh-action-pypi-publish
#            (PEP 740 attestations are generated by the action and uploaded with the files)
#
# Approval gate: the `pypi` environment must have REQUIRED REVIEWERS (Settings > Environments > pypi)
# and a deployment-branch/tag rule; this file cannot set that, and without it nothing waits. The
# same name must be given as the environment of the trusted publisher on PyPI.
#
# Verify what was published (an outsider, after a real release):
#   gh attestation verify <file> --repo <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/publish-pypi.yml
# The SHA-256 of each file is also written to the job summary of the build job.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after the approval gate. Leave unticked for a build-only dry run. Only honoured when run on a v* tag."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  guard:
    name: Commit is on main, tag matches version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # One place decides whether this run may publish. A release always intends to; a manual run
      # only when asked to AND on a version tag. Everything else is a dry run.
      - name: Decide whether this run is a publish or a dry run
        id: intent
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false
          if [ "${EVENT}" = "release" ]; then
            publish=true
          elif [ "${EVENT}" = "workflow_dispatch" ] && [ "${INPUT_PUBLISH}" = "true" ]; then
            if [ "${REF_TYPE}" != "tag" ]; then
              echo "::error::publish was requested on a ${REF_TYPE}; run the workflow on a v* tag, or untick publish for a dry run."
              exit 1
            fi
            publish=true
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "This run will publish: ${publish}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Require the commit to be an ancestor of origin/main (publish runs)
        if: steps.intent.outputs.publish == 'true'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not on main; refusing to publish it."
            exit 1
          fi

  build:
    name: Build and check distributions
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # keyless identity for the provenance attestation (not a PyPI identity)
      attestations: write   # store the GitHub attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install "build==1.6.1" "twine==7.0.0"
      # Same script a person runs locally for a dry run. On a publish run the tag must equal the
      # package version, so a mis-tagged release cannot upload a different version's files.
      - name: Build and check (python -m build, twine check --strict)
        env:
          PUBLISH: ${{ needs.guard.outputs.publish }}
          TAG: ${{ github.ref_name }}
        shell: bash   # explicit bash adds -o pipefail, so a failing build is not hidden by `| tee`
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            scripts/build-dist.sh --out dist --expect-tag "${TAG}" | tee "${RUNNER_TEMP}/sha256.txt"
          else
            scripts/build-dist.sh --out dist | tee "${RUNNER_TEMP}/sha256.txt"
          fi
          { echo '### SHA-256 of the built files'; echo '```'; cat "${RUNNER_TEMP}/sha256.txt"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
      # Provenance names THIS workflow run and commit as the producer of exactly these files.
      # Skipped on a dry run: a dry run attests nothing.
      - name: Attest build provenance
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload the distributions for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (trusted publishing, approval required)
    needs: [guard, build]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Protected environment: add required reviewers in Settings > Environments > pypi so this job
    # waits for a person. The PyPI trusted publisher must name this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/neuralbridge-middleware/
    permissions:
      id-token: write   # trusted publishing: exchanged for a short-lived PyPI token. Nothing else.
    steps:
      - name: Download the distributions built and attested by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI (Trusted Publisher, no token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
