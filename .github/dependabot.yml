# dependabot[bot]: dependency update PRs. It only ever opens PRs; nothing here merges anything
# (merging to main is the founder's, see CLAUDE.md), and CI must be green on every one.
version: 2
updates:
  # Every action is pinned to a commit SHA with a version comment; Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    commit-message: {prefix: "ci"}
    labels: [dependencies, github-actions]
    groups:
      actions: {patterns: ["*"]}

  # The Next.js site. Minor and patch updates arrive as one PR; majors stay separate.
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps(site)"}
    labels: [dependencies, site]
    groups:
      site-minor-patch:
        update-types: [minor, patch]

  # Base images of the platform and the assurance service images.
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    commit-message: {prefix: "deps(docker)"}
    labels: [dependencies, docker]
  - package-ecosystem: docker
    directory: /deploy/assurance
    schedule: {interval: weekly, day: monday}
    commit-message: {prefix: "deps(docker)"}
    labels: [dependencies, docker]

  # Python: security updates only. requirements/*.txt are human-edited lower bounds and the
  # hash-pinned *.lock files are the real pins (scripts/lock.sh); a version bump to the .txt
  # alone fails the "Lock drift" job by design. A security PR therefore needs
  # `scripts/lock.sh` run on its branch before it can go green.
  - package-ecosystem: pip
    directory: /requirements
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 0
    commit-message: {prefix: "deps(py)"}
    labels: [dependencies, python, security]
