# NeuralBridge Kubernetes Deployment
# TOPOLOGY WARNING (read docs/GO-LIVE.md "Deployment topology"): this manifest runs the legacy PLATFORM
# image with ONE replica (the ledger and account store are single-writer) and no volume. It is NOT a supported way to host the evidence ledger or the
# account store: those are SQLite WAL files that need ONE machine and ONE local volume (never NFS or
# another shared filesystem), and the /ai control plane's own SQLite store (NEURALBRIDGE_AI_STORE) is
# per replica. Rate limits and the Stripe budget are per process, so replicas x workers multiplies them.
# `strategy: Recreate` is deliberate: a RollingUpdate would run the old and the new pod together, i.e.
# two writers on one chain. tests/test_container_static.py pins replicas: 1 and Recreate.
# Treat this file as an unexercised example, not a deployment recipe.
# Apply: kubectl apply -f deploy/k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralbridge
  namespace: neuralbridge
  labels:
    app: neuralbridge
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neuralbridge
      component: api
  template:
    metadata:
      labels:
        app: neuralbridge
        component: api
    spec:
      serviceAccountName: neuralbridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: neuralbridge
          image: ghcr.io/your-org/neuralbridge:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NEURALBRIDGE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neuralbridge-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: neuralbridge-secrets
                  key: redis-url
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: neuralbridge-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: neuralbridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: neuralbridge
  namespace: neuralbridge
spec:
  selector:
    app: neuralbridge
    component: api
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Namespace
metadata:
  name: neuralbridge
  labels:
    app: neuralbridge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuralbridge
  namespace: neuralbridge
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuralbridge
  namespace: neuralbridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuralbridge
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuralbridge
  namespace: neuralbridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - neuralbridge.example.com
      secretName: neuralbridge-tls
  rules:
    - host: neuralbridge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuralbridge
                port:
                  number: 80
