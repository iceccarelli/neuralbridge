# NeuralBridge Helm Chart — Default Values
# TOPOLOGY WARNING (read docs/GO-LIVE.md "Deployment topology"): this manifest runs the legacy PLATFORM
# image with ONE replica (the ledger and account store are single-writer) and no volume. It is NOT a supported way to host the evidence ledger or the
# account store: those are SQLite WAL files that need ONE machine and ONE local volume (never NFS or
# another shared filesystem), and the /ai control plane's own SQLite store (NEURALBRIDGE_AI_STORE) is
# per replica. Rate limits and the Stripe budget are per process, so replicas x workers multiplies them.
# Treat this file as an unexercised example, not a deployment recipe.

# Single writer: never raise this above 1 (tests/test_container_static.py pins it).
replicaCount: 1

image:
  repository: ghcr.io/your-org/neuralbridge
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: neuralbridge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: neuralbridge-tls
      hosts:
        - neuralbridge.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Single writer: autoscaling must stay off. Every replica is another writer on the hash-chained
# SQLite ledger and account store, and the chain forks silently (docs/GO-LIVE.md "Deployment
# topology"). tests/test_container_static.py pins enabled: false and maxReplicas: 1.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: true
  auth:
    database: neuralbridge

redis:
  enabled: true
  architecture: standalone

env:
  NEURALBRIDGE_ENV: production
