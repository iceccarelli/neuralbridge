# NeuralBridge Helm Chart — Default Values
# TOPOLOGY WARNING (read docs/GO-LIVE.md "Deployment topology"): this manifest runs the legacy PLATFORM
# image with 3 replicas and no volume. It is NOT a supported way to host the evidence ledger or the
# account store: those are SQLite WAL files that need ONE machine and ONE local volume (never NFS or
# another shared filesystem), and the /ai control plane's own SQLite store (NEURALBRIDGE_AI_STORE) is
# per replica. Rate limits and the Stripe budget are per process, so replicas x workers multiplies them.
# Treat this file as an unexercised example, not a deployment recipe.

replicaCount: 3

image:
  repository: ghcr.io/your-org/neuralbridge
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: neuralbridge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: neuralbridge-tls
      hosts:
        - neuralbridge.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: true
  auth:
    database: neuralbridge

redis:
  enabled: true
  architecture: standalone

env:
  NEURALBRIDGE_ENV: production
