[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralbridge-middleware"
version = "0.1.1"
description = "Industrial Autonomous Assurance: hash-chained evidence and change-assurance for machines whose software can affect safety, with an offline kit, API and MCP server. Includes the experimental NeuralBridge adapter platform it grew out of. Supports your own CRA Art. 14 and Machinery Regulation evidence process; it is not a certification."
readme = "README.md"
# PEP 639: an SPDX *LicenseRef* expression, because this is a proprietary, all-rights-reserved
# licence with no SPDX identifier. The text is the LICENSE file (shipped as License-File). setuptools
# understands `license` as an SPDX string and `license-files` from 77.0.0; the older
# `license = {text = ...}` table and the "License ::" classifier are deprecated and warn.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "NeuralBridge Contributors"}
]
keywords = [
    "industrial-assurance", "machine-safety", "cyber-resilience-act",
    "machinery-regulation", "evidence", "hash-chain", "attestation",
    "offline", "mcp", "adapters"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
    "Framework :: FastAPI",
]
# Base install: what every surface imports, measured by installing into an empty venv and
# importing/running it (tests/test_packaging_contract.py pins this). The offline kit and the
# `assurance` CLI need `cryptography` (assurance.attest.keys) and nothing else outside the
# standard library. Everything else is an extra, listed in the table below.
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Which extra for which surface (README "Install"; tests/test_packaging_contract.py):
#   offline kit + CLI ............ base install (no extra)
#   `assurance watch push`, `supplier fetch` ... assurance-supplier-fetch (httpx, imported lazily)
#   `assurance capabilities`, hosted API ....... assurance-api
#   assurance MCP gateway ........ assurance-mcp
#   neuralbridge integration platform ... platform
#   neuralbridge-ai-mcp .......... neuralbridge-ai-mcp
assurance-attest = [
    "cryptography>=42.0.0",
]
assurance-supplier-fetch = [
    "httpx>=0.27.0",
]
# Mirrors requirements/assurance-service.txt (the hash-locked service image). httpx is
# imported at module level by assurance.billing.stripe_gateway; pydantic by the route schemas.
assurance-api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]
assurance-mcp = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]
# neuralbridge.mcp.server is an HTTP client, but `import neuralbridge` loads
# neuralbridge.config, which needs pydantic-settings.
neuralbridge-ai-mcp = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
]
# The NeuralBridge integration platform (src/neuralbridge: `neuralbridge` command, REST/MCP
# gateway, /ai control plane). `pip install '.[platform]'` installs exactly what a plain
# `pip install .` installed before the base install was reduced to cryptography.
platform = [
    # imported by src/neuralbridge (measured: import every module in a venv with only these)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.15.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "tiktoken>=0.6.0",
    "passlib[bcrypt]>=1.7.4",
    # declared since the first commit, imported by nothing under src/ today; kept so that
    # `.[platform]` does not silently drop packages an existing deployment may rely on.
    # (tests/test_packaging_contract.py pins this list, so a new import must move it up.)
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]
# Experimental/evolving neuralbridge adapters (see
# reports/NEURALBRIDGE-AI-CAPABILITY-MATRIX.md): each pulls in a vendor SDK
# this repo does not install by default, and CI's own test job
# (requirements/test.txt) deliberately does not install any of these either
# — tests that need the real SDK skip honestly instead of hard-failing.
bigquery = [
    "google-cloud-bigquery>=3.11.0",
]
mongodb = [
    "motor>=3.3.0",
]
mysql = [
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
]
# Everything the test suite imports (both surfaces plus the MCP gateways) and everything CI's lint
# job runs (ruff, mypy and mypy's stubs). The one reproducible local setup is
#   python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
# requirements/dev.txt (CI lint) and requirements/test.txt (CI tests) must stay equivalent for the
# shared tools; tests/test_dev_install_parity.py fails when they do not.
dev = [
    "neuralbridge-middleware[platform,assurance-api,assurance-mcp]",
    "packaging>=23.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0,<0.18",
    "mypy>=1.8.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    # CI's lint job (`mypy src/neuralbridge/ src/assurance/`) installs requirements/dev.txt, which
    # carries these stubs; without them yaml/pymysql are untyped here and mypy disagrees with CI.
    # tests/test_dev_install_parity.py keeps this list and requirements/dev.txt/test.txt equal.
    "types-PyYAML>=6.0.0",
    "types-PyMySQL>=1.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://neuralbridge.io"
Documentation = "https://neuralbridge.io/docs"

[project.scripts]
neuralbridge = "neuralbridge.main:cli"

assurance = "assurance.cli:main"
assurance-api = "assurance.api.service:main"
assurance-mcp = "assurance.mcp.server:main"
neuralbridge-ai-mcp = "neuralbridge.mcp.server:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN"]
ignore = [
    "E501",   # Line too long — handled by formatter
    "S101",   # Use of assert (used for type narrowing)
    "S104",   # Possible binding to all interfaces
    "S105",   # Possible hardcoded password
    "S311",   # Standard pseudo-random generators
    "S608",   # Possible SQL injection (parameterised in practice)
    "DTZ001", # datetime.now() without tz (used in Pydantic defaults)
    "DTZ003", # datetime.utcnow() (used in Pydantic defaults)
    "B008",   # Function call in default argument (FastAPI Depends)
    "A002",   # Shadowing built-in (e.g. license)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# A command line writes to stdout; that is the interface, not a stray debug print.
"src/assurance/cli.py" = ["T20"]
"src/assurance/security/art14/cli.py" = ["T20"]
"src/assurance/machine/cli.py" = ["T20"]
"src/assurance/machinery/cli.py" = ["T20"]
"src/assurance/fleet/cli.py" = ["T20"]
"src/assurance/check/cli.py" = ["T20"]
"src/assurance/collect/cli.py" = ["T20"]
"src/assurance/report/cli.py" = ["T20"]
"src/assurance/bridge/cli.py" = ["T20"]
"src/assurance/watch/cli.py" = ["T20"]
"src/assurance/watch/push.py" = ["T20"]
"src/assurance/attest/cli.py" = ["T20"]
"src/assurance/kit/cli.py" = ["T20"]
"src/assurance/billing/cli.py" = ["T20"]
"src/assurance/supplier/cli.py" = ["T20"]
"src/assurance/value/cli.py" = ["T20"]
"src/assurance/capabilities_cli.py" = ["T20"]
"src/assurance/change/cli.py" = ["T20"]
"src/assurance/evidence/cli.py" = ["T20"]
"src/assurance/evidence/restore_check.py" = ["T20"]
"src/assurance/api/service.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit (pytest-asyncio >= 0.24): leaving it unset makes every run emit a deprecation warning.
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=neuralbridge --cov=assurance --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Per-module debt table for src/assurance/. CI runs `mypy src/neuralbridge/ src/assurance/`
# (.github/workflows/ci.yml). Every module not listed here is checked under the strict settings
# above. The modules listed had 155 errors in 39 modules when src/assurance/ was
# first put under mypy (mypy 2.4.1, Python 3.11); they are silenced EXPLICITLY, by name, and the
# number after each name is its error count then. There is deliberately no wildcard: a new
# module is strict from its first commit, and a module that has been cleaned up must be deleted
# from this list. Do not add a module to hide a new error.
# tests/test_mypy_ignore_table.py checks that every name here is a real module.
[[tool.mypy.overrides]]
module = [
    "assurance.api.change_routes",  # 2
    "assurance.api.evidence_routes",  # 2
    "assurance.api.machine_routes",  # 1
    "assurance.api.routes",  # 4
    "assurance.api.service",  # 2
    "assurance.billing.accounts",  # 6
    "assurance.billing.reconcile",  # 28
    "assurance.billing.stripe_gateway",  # 2
    "assurance.billing.subscription_state",  # 1
    "assurance.capabilities",  # 1
    "assurance.change.service",  # 1
    "assurance.core.tiers",  # 2
    "assurance.evidence.ledger",  # 1
    "assurance.evidence.restore_check",  # 1
    "assurance.fleet.cli",  # 8
    "assurance.fleet.csaf",  # 1
    "assurance.fleet.registry",  # 2
    "assurance.intel.cli",  # 2
    "assurance.intel.csaf_live",  # 3
    "assurance.intel.fetch",  # 1
    "assurance.intel.parsers",  # 3
    "assurance.intel.store",  # 1
    "assurance.machinery.amend",  # 1
    "assurance.machinery.inventory",  # 2
    "assurance.machinery.record",  # 2
    "assurance.ops.check",  # 6
    "assurance.ops.cli",  # 7
    "assurance.ops.cycle",  # 5
    "assurance.ops.notify",  # 1
    "assurance.security.art14.cli",  # 5
    "assurance.security.art14.clock",  # 1
    "assurance.supplier.netpolicy",  # 19
    "assurance.supplier.trust",  # 8
    "assurance.value.position",  # 15
    "assurance.watch.cli",  # 1
    "assurance.watch.ingest",  # 1
    "assurance.watch.open_case",  # 1
    "assurance.watch.push",  # 2
    "assurance.watch.runner",  # 3
]
ignore_errors = true
